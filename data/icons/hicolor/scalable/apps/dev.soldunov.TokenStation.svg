<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The macOS icon (frontends/macos/Resources/AppIcon.icon) flattened for the
       hicolor theme: two glass tubes with the Claude and Codex levels inside, on a
       continuous-corner body. The sheen macOS renders live is painted in here with
       plain gradients, since Qt SVG draws no filters. -->
  <defs>
    <linearGradient id="body" x1="0" y1="8" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32384a"/>
      <stop offset="1" stop-color="#0e1017"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="8" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="claude" x1="0" y1="56" x2="0" y2="93" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9464"/>
      <stop offset="1" stop-color="#d9431a"/>
    </linearGradient>
    <linearGradient id="codex" x1="0" y1="71" x2="0" y2="93" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35e0a4"/>
      <stop offset="1" stop-color="#008a62"/>
    </linearGradient>
    <!-- Rounds each column: a highlight left of centre, a shadow at the right wall. -->
    <linearGradient id="column" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".22" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".8" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".22"/>
    </linearGradient>
    <!-- A glass cylinder catches light at both walls and lets it through the middle. -->
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset=".12" stop-color="#ffffff" stop-opacity=".21"/>
      <stop offset=".3" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset=".72" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset=".92" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="32" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <path fill="url(#body)" d="M46.52 8H81.48C92.57 8 98.12 8 104.09 9.89C110.6 12.26 115.74 17.4 118.11 23.91C120 29.88 120 35.43 120 46.52V81.48C120 92.57 120 98.12 118.11 104.09C115.74 110.6 110.6 115.74 104.09 118.11C98.12 120 92.57 120 81.48 120H46.52C35.43 120 29.88 120 23.91 118.11C17.4 115.74 12.26 110.6 9.89 104.09C8 98.12 8 92.57 8 81.48V46.52C8 35.43 8 29.88 9.89 23.91C12.26 17.4 17.4 12.26 23.91 9.89C29.88 8 35.43 8 46.52 8Z"/>
  <path fill="none" stroke="url(#rim)" d="M46.26 8.5H81.74C92.61 8.5 98.05 8.5 103.9 10.35C110.29 12.68 115.32 17.71 117.65 24.1C119.5 29.95 119.5 35.39 119.5 46.26V81.74C119.5 92.61 119.5 98.05 117.65 103.9C115.32 110.29 110.29 115.32 103.9 117.65C98.05 119.5 92.61 119.5 81.74 119.5H46.26C35.39 119.5 29.95 119.5 24.1 117.65C17.71 115.32 12.68 110.29 10.35 103.9C8.5 98.05 8.5 92.61 8.5 81.74V46.26C8.5 35.39 8.5 29.95 10.35 24.1C12.68 17.71 17.71 12.68 24.1 10.35C29.95 8.5 35.39 8.5 46.26 8.5Z"/>
  <g fill="#000000" fill-opacity=".14">
    <rect x="33" y="33" width="28" height="65" rx="14"/>
    <rect x="67" y="33" width="28" height="65" rx="14"/>
  </g>
  <path fill="url(#claude)" d="M37 56H57V83A10 10 0 0 1 37 83Z"/>
  <path fill="url(#column)" d="M37 56H57V83A10 10 0 0 1 37 83Z"/>
  <path fill="url(#codex)" d="M71 71H91V83A10 10 0 0 1 71 83Z"/>
  <path fill="url(#column)" d="M71 71H91V83A10 10 0 0 1 71 83Z"/>
  <g fill="#ffffff" fill-opacity=".6">
    <rect x="37.5" y="56" width="19" height="1" rx=".5"/>
    <rect x="71.5" y="71" width="19" height="1" rx=".5"/>
  </g>
  <g fill="url(#wall)">
    <rect x="34" y="32" width="26" height="64" rx="13"/>
    <rect x="68" y="32" width="26" height="64" rx="13"/>
  </g>
  <g fill="none" stroke="url(#edge)">
    <rect x="34.5" y="32.5" width="25" height="63" rx="12.5"/>
    <rect x="68.5" y="32.5" width="25" height="63" rx="12.5"/>
  </g>
</svg>
