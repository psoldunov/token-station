#:schema https://www.ensemblr.dev/schemas/settings.schema.json

# Linux commands use the flake's dev shell. macOS uses the host Rust/Xcode
# toolchains because the flake only exposes Linux systems.

[scripts]
# Fetches Rust dependencies and, on macOS, resolves the Swift package too.
setup = "if [ \"$(uname -s)\" = Darwin ]; then .ensemblr/scripts/macos.sh setup; else nix develop -c cargo fetch --locked; fi"

# Opens the native front end against a fixture daemon on an isolated transport,
# so it can run beside an installed daemon without reading real credentials.
[scripts.run.preview]
command = "if [ \"$(uname -s)\" = Darwin ]; then .ensemblr/scripts/macos.sh preview; else nix develop -c frontends/plasma/tests/preview.sh; fi"
icon = "eye"
default = true

[scripts.run.test]
command = "if [ \"$(uname -s)\" = Darwin ]; then .ensemblr/scripts/macos.sh test; else nix develop -c cargo test --workspace --locked; fi"
icon = "test-tube"

# Runs the native platform's formatting, static-analysis and frontend lint gates.
[scripts.run.lint]
command = "if [ \"$(uname -s)\" = Darwin ]; then .ensemblr/scripts/macos.sh lint; else nix develop -c sh -c 'cargo fmt --all --check && cargo clippy --workspace --all-targets --locked -- --deny warnings && frontends/plasma/tests/lint.sh'; fi"
icon = "list-checks"

# Builds ./result on Linux or frontends/macos/build/Token Station.app on macOS.
[scripts.run.build]
command = "if [ \"$(uname -s)\" = Darwin ]; then .ensemblr/scripts/macos.sh build; else nix build -L; fi"
icon = "hammer"

# Runs the same platform-specific gates as CI, including a distributable build.
[scripts.run.ci-check]
command = "if [ \"$(uname -s)\" = Darwin ]; then .ensemblr/scripts/macos.sh check; else nix flake check -L --keep-going; fi"
icon = "shield-check"

# The Review button. The Swift gates are the same ones CI's macos job runs;
# Periphery and `swiftlint analyze` need the macOS SDK, so a review on Linux runs
# them on a Mac.
[prompts]
code_review = """
When the change touches the macOS front end (anything under frontends/macos/, or .ensemblr/scripts/macos.sh), run its static analysis as part of the review:

1. The Swift gate: `.ensemblr/scripts/macos.sh swift-lint`, which runs `swiftlint lint --strict`, `swiftlint analyze --strict` from a compiler log, and `periphery scan --strict`. It needs macOS. The package imports Darwin, AppKit and SwiftUI and does not build on Linux, so Periphery cannot scan it there even when it is on PATH. On a Mac, run it in the worktree. On Linux, copy frontends/macos and .ensemblr/scripts/macos.sh to a reachable Mac with the working tree's uncommitted edits, not only HEAD, keep that layout, and run it there.
2. On Linux, also run `swiftlint lint --strict` in frontends/macos locally for fast feedback. It is partial: the static Linux build cannot load SourceKit and skips the rules it names in "Skipping enabled rule" warnings. The Mac run is the gate.

Report every SwiftLint and Periphery finding as a review finding, with its file and line, and do not approve while one stands. Never make a finding go away by suppressing it: no `swiftlint:disable`, no `periphery:ignore`, and no new excluded path, disabled rule or retain option in .swiftlint.yml or .periphery.yml. If a finding is a genuine false positive, leave it and say why. If no Mac was reachable, say that the analyzer and Periphery gates did not run; never call the Swift side clean on SwiftLint alone.
"""

[infisical]
environment = "dev"
path = "/"
project_id = "a79a0de4-2054-4c44-8814-742f5ae80894"
project_name = "Apple Developer Secrets"
site_url = "https://infisical.theswisscheese.com"
