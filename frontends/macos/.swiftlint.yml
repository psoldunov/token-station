# SwiftLint for the macOS front end.
#
# The opt-in rules below were chosen for three reasons, in this order:
#
#   1. Crash safety. `force_unwrapping`, `force_try`, `force_cast`,
#      `implicitly_unwrapped_optional` and `discouraged_optional_boolean` all
#      outlaw the shapes that turn a surprising daemon payload into a menu bar
#      icon that disappears. A front end renders whatever the daemon sends, so
#      every optional has to be handled rather than asserted away.
#   2. One way to write a thing. `sorted_imports`, `explicit_init`,
#      `first_where`, `last_where`, `empty_count`, `empty_string`,
#      `redundant_type_annotation`, `toggle_bool`, `contains_over_filter_count`
#      and friends remove the pointless variation that makes a diff look bigger
#      than the change inside it.
#   3. SwiftUI legibility. `closure_spacing`, `multiline_arguments`,
#      `multiline_parameters` and `vertical_parameter_alignment_on_call` keep
#      the long view-builder call chains readable, and `modifier_order` keeps
#      declarations in a predictable order.
#
# `trailing_closure` is deliberately left out. The commonest closure-pair call
# in SwiftUI is `Binding(get:set:)`, and the rule rewrites it to
# `Binding(get: { … }) { … }`, which hides which half is the setter. The rule
# would buy consistency on a handful of call sites at the cost of the one that
# matters most.
#
# Line length warns at 140: a `.frame(maxWidth: .infinity, alignment: .leading)`
# chain is wider than ordinary Swift, and wrapping it any tighter reads worse.
# Type and file length limits are deliberately close to the project's own
# "small files" rule rather than SwiftLint's defaults.

included:
  - Sources
  - Tests
  - Package.swift

excluded:
  - .build
  - build

# `swiftlint analyze` needs a compiler log, so the analyzer rules are a separate
# run; see the README for the command. `unused_import` is deliberately not among
# them: on this toolchain it reports `import OSLog` as unused in every file that
# uses `Logger`, and the only way to "fix" that is to break the build. Periphery
# does the same analysis from a real index and gets it right, so it owns that
# check and SwiftLint keeps the one it is reliable at.
analyzer_rules:
  - unused_declaration

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_in_static_references
  - prefer_zero_over_explicit_init
  - private_over_fileprivate
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - sorted_first_last
  - sorted_imports
  - static_operator
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - yoda_condition

line_length:
  warning: 140
  error: 180
  ignores_urls: true
  ignores_comments: false

file_length:
  warning: 400
  error: 800

type_body_length:
  warning: 250
  error: 400

function_body_length:
  warning: 50
  error: 80

cyclomatic_complexity:
  warning: 10
  error: 15

nesting:
  type_level: 2

identifier_name:
  # `id` is the name the snapshot schema uses, and Identifiable wants it too;
  # `ok` is the daemon's own provider state and renaming it would break the
  # one-word mapping between the schema and the model.
  allowed_symbols: ["_"]
  excluded:
    - id
    - ok
    - x
    - y

type_name:
  allowed_symbols: ["_"]

trailing_comma:
  mandatory_comma: true

reporter: "xcode"
