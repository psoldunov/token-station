name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The GNOME VM check boots a NixOS guest and needs /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      # Substitutes every result an earlier run or a local
      # `cachix watch-exec psoldunov -- nix flake check` already built, and
      # pushes what this run builds. Without the secret (fork pull requests) it
      # only reads.
      - uses: cachix/cachix-action@v17
        with:
          name: psoldunov
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: nix flake check
        run: nix flake check -L --keep-going

  # The RustSec database is fetched at run time, which the `nix flake check`
  # sandbox cannot do. A newly published advisory can fail this job without a
  # code change; fix it by updating the crate or listing it in deny.toml.
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: cargo deny check advisories
        run: nix shell --inputs-from . nixpkgs#cargo nixpkgs#cargo-deny -c cargo deny --locked check advisories

  # The macOS half: the daemon's macOS-only code (socket transport, Keychain) only
  # compiles here, and the menu bar app needs the macOS SDK.
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- --deny warnings
      - name: cargo test
        run: cargo test --workspace --locked
      - name: swift test
        working-directory: frontends/macos
        run: swift test
      - name: Install SwiftLint and Periphery
        run: brew install swiftlint periphery
      - name: swiftlint
        working-directory: frontends/macos
        run: swiftlint lint --strict
      # The analyzer rules read a compiler log, which only lists what that build
      # compiled: a clean scratch path and --build-tests make it the whole package.
      - name: swiftlint analyze
        working-directory: frontends/macos
        run: |
          swift build --build-tests --build-system native --scratch-path "$RUNNER_TEMP/analyze" -v > "$RUNNER_TEMP/swiftbuild.log"
          swiftlint analyze --strict --compiler-log-path "$RUNNER_TEMP/swiftbuild.log"
      - name: periphery
        working-directory: frontends/macos
        run: periphery scan --strict
      - name: Build Token Station.app
        run: frontends/macos/scripts/build-app.sh --zip
      - uses: actions/upload-artifact@v4
        with:
          name: TokenStation-macOS
          path: frontends/macos/build/TokenStation-macOS.zip
          if-no-files-found: error

  # Pushes to master only: pull requests do not wait on the static musl build.
  # Build it locally with `nix build .#appimage` when a change touches it; the
  # release workflow builds and smoke-tests it again on every tag.
  appimage:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: psoldunov
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build AppImage
        run: nix build -L .#appimage
      - name: Smoke-test AppImage on a non-Nix system
        # bash with `-o pipefail`, so a failing command inside a pipe fails the step.
        shell: bash
        run: |
          ./result/TokenStation-x86_64.AppImage --appimage-extract-and-run --help
          ./result/TokenStation-x86_64.AppImage --appimage-extract-and-run status --json | head -c 400
      - uses: actions/upload-artifact@v4
        with:
          name: TokenStation-x86_64.AppImage
          path: result/TokenStation-x86_64.AppImage
