name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  appimage:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build AppImage
        run: nix build -L .#appimage
      - uses: softprops/action-gh-release@v2
        with:
          files: result/TokenStation-${{ matrix.arch }}.AppImage
