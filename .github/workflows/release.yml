name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Nothing is published before the same gate CI uses has passed on the tag.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The GNOME VM check boots a NixOS guest and needs /dev/kvm.
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: nix flake check
        run: nix flake check -L --keep-going

      - name: cargo deny check advisories
        run: nix shell --inputs-from . nixpkgs#cargo nixpkgs#cargo-deny -c cargo deny --locked check advisories

  build:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build AppImage
        run: nix build -L .#appimage
      - name: Smoke-test AppImage on a non-Nix system
        shell: bash
        run: |
          ./result/TokenStation-${{ matrix.arch }}.AppImage --appimage-extract-and-run --version
          ./result/TokenStation-${{ matrix.arch }}.AppImage --appimage-extract-and-run status --json > status.json
          head -c 400 status.json
      - uses: actions/upload-artifact@v4
        with:
          name: TokenStation-${{ matrix.arch }}.AppImage
          path: result/TokenStation-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  # Universal (Apple silicon + Intel) app, ad-hoc signed: there is no Developer ID
  # to sign or notarize with yet, so the README explains the first launch.
  macos:
    needs: check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- --deny warnings
      - name: cargo test
        run: cargo test --workspace --locked
      - name: swift test
        working-directory: frontends/macos
        run: swift test
      - name: Build Token Station.app
        run: frontends/macos/scripts/build-app.sh --universal --zip
      - uses: actions/upload-artifact@v4
        with:
          name: TokenStation-macOS.zip
          path: frontends/macos/build/TokenStation-macOS.zip
          if-no-files-found: error

  # One job creates the release, so the builds cannot race each other.
  release:
    needs: [build, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: TokenStation-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/TokenStation-*.AppImage
            artifacts/TokenStation-macOS.zip
          fail_on_unmatched_files: true
